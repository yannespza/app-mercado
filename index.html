<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Mercado</title>
<meta name="theme-color" content="#0c0c0f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Mercado">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0e; --bg2:#121216; --card:#16161b; --card2:#1c1c22; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#f2f2f5; --muted:#9a9aa6; --faint:#62626d;
  --purple:#c77dff; --purple2:#8f4fd6; --purpleBg:rgba(199,125,255,.14);
  --lime:#c8f43a; --limeBg:rgba(200,244,58,.13);
  --red:#ff6b7a; --redBg:rgba(255,107,122,.13);
  --r:22px; --r2:14px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4}
body{min-height:100vh;background:radial-gradient(120% 60% at 100% 0%,rgba(143,79,214,.16),transparent 60%),radial-gradient(90% 50% at 0% 100%,rgba(200,244,58,.05),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--purple)}
.app{max-width:1100px;margin:0 auto;padding:calc(14px + var(--safe-t)) 16px calc(110px + var(--safe-b));display:flex;gap:28px}
.side{display:none}
main{flex:1;min-width:0}
h1{font-size:26px;font-weight:500;letter-spacing:-.02em;margin:0}
h2{font-size:19px;font-weight:500;letter-spacing:-.01em;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-.02em}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--lime),#9bd11f);display:grid;place-items:center;color:#14200a}
.logo svg{width:16px;height:16px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;background:rgba(255,255,255,.03)}
.iconbtn svg{width:20px;height:20px}
.tline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-4px 0 16px}
.row2>*{min-width:0}
.bar:first-child .tip{left:0}.bar:last-child .tip{right:0}
.li .t2.wrap{white-space:normal}
.monthbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.monthbar button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.monthbar button:disabled{opacity:.3}
.monthbar span{min-width:112px;text-align:center;font-weight:600;font-size:14px;text-transform:capitalize}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{padding:14px 14px 15px}
.kpi .lb{color:var(--muted);font-size:12.5px;margin-bottom:6px}
.kpi .v{font-size:21px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-good{color:var(--lime);background:var(--limeBg)}
.b-bad{color:var(--red);background:var(--redBg)}
.b-neu{color:var(--muted);background:rgba(255,255,255,.06)}
.b-pur{color:var(--purple);background:var(--purpleBg)}
.sub{color:var(--muted);font-size:12.5px}
.row2{display:grid;gap:12px;margin-bottom:12px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.chart{position:relative;height:190px}
.bars{display:flex;align-items:flex-end;justify-content:space-around;height:170px;padding-top:34px;gap:6px;border-bottom:1px dashed var(--line);position:relative}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bar i{display:block;width:16px;border-radius:999px;background:linear-gradient(180deg,rgba(199,125,255,.55),rgba(143,79,214,.25));min-height:6px;transition:.25s}
.bar.on i{width:26px;background:linear-gradient(180deg,#e3b8ff,var(--purple) 40%,var(--purple2));box-shadow:0 0 22px rgba(199,125,255,.55)}
.bar .tip{position:absolute;bottom:calc(100% + 6px);background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:5px 8px;font-size:12px;font-weight:600;white-space:nowrap;display:none}
.bar.on .tip{display:block}
.blabels{display:flex;justify-content:space-around;gap:6px;margin-top:8px}
.blabels span{flex:1;text-align:center;color:var(--muted);font-size:12px;text-transform:capitalize}
.blabels span.on{color:var(--text);font-weight:600}
.donutwrap{display:flex;align-items:center;gap:18px}
.donut{width:132px;height:132px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:30%;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.legend{display:flex;flex-direction:column;gap:9px;min-width:0;flex:1}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.legend b{font-weight:600;margin-left:auto;padding-left:6px}
.legend .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.li:first-child{border-top:0}
.li .ic{width:40px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700;font-size:13px;color:var(--purple)}
.li .tx{flex:1;min-width:0}
.li .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t2{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .vv{text-align:right;font-weight:600;flex:none}
.li .vv .sub{font-weight:500}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 18px;font-weight:600;border:1px solid var(--line2);background:rgba(255,255,255,.04)}
.btn.pri{background:var(--lime);color:#15200a;border-color:transparent}
.btn.pur{background:var(--purple);color:#1a0a2a;border-color:transparent}
.btn.dan{color:var(--red);border-color:rgba(255,107,122,.35)}
.btn.full{width:100%}
.btn svg{width:18px;height:18px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;padding:8px 12px;border-radius:999px;color:var(--muted);font-size:13px;font-weight:600}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--purpleBg);border:1px solid rgba(199,125,255,.3);border-radius:16px;padding:11px 14px;margin-bottom:12px;font-size:13px}
.banner button{color:var(--purple);font-weight:700;white-space:nowrap}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));width:min(440px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-around;background:rgba(22,22,27,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);border-radius:26px;padding:7px;z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--faint);font-weight:600;padding:5px 8px;border-radius:16px;min-width:56px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--text)}
.nav button.on svg{color:var(--lime)}
.nav .scan{width:56px;height:56px;border-radius:50%;background:var(--lime);color:#15200a;margin-top:-26px;box-shadow:0 8px 26px rgba(200,244,58,.35),0 0 0 6px var(--bg);display:grid;place-items:center;min-width:0;padding:0}
.nav .scan svg{width:26px;height:26px;color:#15200a!important}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.overlay.open{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:10px 18px calc(22px + var(--safe-b));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line2);margin:2px auto 12px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cam{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:1/1;max-height:52vh;width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:16%;border-radius:20px;box-shadow:0 0 0 999px rgba(0,0,0,.35);border:2px solid var(--lime)}
.cam .msg{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:13px;color:#fff;text-shadow:0 1px 4px #000}
.stack{display:flex;flex-direction:column;gap:10px}
.hr{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;margin:6px 0}
.hr::before,.hr::after{content:"";flex:1;height:1px;background:var(--line)}
.err{background:var(--redBg);color:#ffc2c8;border:1px solid rgba(255,107,122,.3);border-radius:14px;padding:11px 13px;font-size:13.5px}
.ok{background:var(--limeBg);color:#e6ffa6;border:1px solid rgba(200,244,58,.3);border-radius:14px;padding:11px 13px;font-size:13.5px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.2);border-top-color:var(--lime);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rank{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.rank .pos{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--card2);flex:none}
.rank.first{border-color:rgba(200,244,58,.35);background:linear-gradient(90deg,rgba(200,244,58,.08),transparent 60%),var(--card)}
.rank.first .pos{background:var(--lime);color:#15200a}
.meter{height:6px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;border-radius:9px}
.search{position:relative;margin-bottom:12px}
.search input{padding-left:40px;border-radius:999px;background:var(--card)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.suggest{border:1px dashed rgba(199,125,255,.4);background:var(--purpleBg);border-radius:18px;padding:14px;margin-bottom:12px}
.suggest .pair{background:var(--card);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
.suggest .acts{display:flex;gap:8px;margin-top:9px}
.suggest .acts .btn{padding:8px 14px;font-size:13px}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px}
.ptable th{color:var(--muted);font-weight:500;text-align:left;padding:8px 6px;font-size:12px;border-bottom:1px solid var(--line)}
.ptable td{padding:10px 6px;border-bottom:1px solid var(--line)}
.ptable td.r,.ptable th.r{text-align:right}
.spark{width:100%;height:70px;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(146px + var(--safe-b));background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:10px 16px;font-size:13.5px;z-index:60;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.pr.good{color:var(--lime)!important;font-weight:700}
.pr.bad{color:var(--red)!important;font-weight:700}
.un{font-size:.78em;color:var(--muted);font-weight:500;margin-left:1px}
.pr.good .un,.pr.bad .un{color:inherit;opacity:.75}
.li.rep{padding-left:12px;position:relative}
.li.rep::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--line2)}
.li.rep.good::before{background:var(--lime)}
.li.rep.bad::before{background:var(--red)}
.li.rep .vv{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.filt{border-color:var(--line)}
.filt.on{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple) inset}
.litem{gap:10px}
.litem .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;color:#15200a}
.litem .chk svg{width:15px;height:15px}
.litem.feito .chk{background:var(--lime);border-color:var(--lime)}
.litem.feito .t1{text-decoration:line-through;color:var(--faint)}
.litem.feito .t2{opacity:.5}
.litem.off .t1{color:var(--muted)}
.dica-on{position:relative;z-index:31;box-shadow:0 0 0 3px var(--lime),0 0 0 9px rgba(200,244,58,.25)!important;border-radius:14px;animation:pulsa 1.2s ease-in-out infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 3px var(--lime),0 0 0 15px rgba(200,244,58,.08)!important}}
.dica-balao{position:fixed;z-index:70;max-width:280px;background:var(--lime);color:#15200a;font-weight:700;font-size:14px;padding:11px 14px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.dica-balao::after{content:"";position:absolute;left:calc(var(--seta) - 8px);border:8px solid transparent}
.dica-balao.baixo::after{top:-16px;border-bottom-color:var(--lime)}
.dica-balao.cima::after{bottom:-16px;border-top-color:var(--lime)}
.fixoPrecos{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--safe-b));z-index:19;display:flex;align-items:center;gap:8px;background:var(--lime);color:#15200a;font-weight:700;border-radius:999px;padding:12px 20px;box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 0 4px var(--bg);white-space:nowrap}
.fixoPrecos svg{width:18px;height:18px}
@media (min-width:980px){.fixoPrecos{bottom:24px;left:auto;right:24px;transform:none}}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.hide{display:none!important}
@media (min-width:720px){
  .grid4{grid-template-columns:repeat(4,1fr);gap:12px}
  .row2{grid-template-columns:1.5fr 1fr}
  .kpi .v{font-size:24px}
}
@media (min-width:980px){
  .side{display:flex;flex-direction:column;gap:4px;width:210px;flex:none;position:sticky;top:20px;height:calc(100vh - 40px)}
  .side .brand{margin:8px 8px 26px}
  .side button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:500;text-align:left}
  .side button svg{width:20px;height:20px}
  .side button.on{color:var(--text);background:var(--card)}
  .side .btn{margin-top:14px;justify-content:center;color:#15200a}
  .nav{display:none}
  .top .brand{visibility:hidden}
  .app{padding-bottom:40px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<nav class="nav" id="nav"></nav>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hide">

<script src="parser.js"></script>

/* ---------- preço de referência: por kg, por litro ou por unidade ----------
   Produtos pesados (KG) já vêm com o preço do quilo na nota.
   Pacotes com peso/volume no nome (ex.: "CAFE 500G", "LEITE 12X1L") são convertidos para o preço do kg/litro.
   Itens pesados na balança que a nota lança como "1 UN" sem o peso ficam fora da comparação. */
function tamanho(nome){
  var s=String(nome||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
  var fat={KG:1,KGS:1,K:1,KILO:1,KILOS:1,QUILO:1,QUILOS:1,G:0.001,GR:0.001,GRS:0.001,GRAMAS:0.001,ML:0.001,L:1,LT:1,LTS:1,LITRO:1,LITROS:1};
  var m=/(?:(\d+)\s*X\s*)?(\d+(?:[.,]\d+)?)\s*(KGS?|KILOS?|QUILOS?|K|GRAMAS|GRS?|G|ML|LITROS?|LTS?|L)(?![A-Z])/.exec(s);
  if(!m) return null;
  var q=(m[1]?+m[1]:1)*parseFloat(m[2].replace(',','.'))*fat[m[3]];
  return q>0?{q:q,base:/^(ML|L|LT|LTS|LITRO|LITROS)$/.test(m[3])?'L':'kg'}:null;
}
function precoRef(it,peso){
  var un=String(it.un||'').toUpperCase().replace(/[^A-Z]/g,''), p=it.vUnit, q=+it.qtd;
  if(!(p>0)) return {v:null,base:'un'};
  if(peso&&!/^(KG|KGS|KILO|QUILO|KILOGRAMA|G|GR|GRS|GRAMA|L|LT|LTS|LITRO|ML)$/.test(un)) return {v:p/peso.q,base:peso.base};
  if(/^(KG|KGS|KILO|QUILO|KILOGRAMA)$/.test(un)) return {v:p,base:'kg'};
  if(/^(G|GR|GRS|GRAMA)$/.test(un)) return {v:p*1000,base:'kg'};
  if(/^(L|LT|LTS|LITRO)$/.test(un)) return {v:p,base:'L'};
  if(un==='ML') return {v:p*1000,base:'L'};
  if(q>0&&Math.abs(q-Math.round(q))>0.0005) return {v:p,base:'kg'}; // vendido a granel, lançado como UN com quantidade quebrada
  var t=tamanho(it.nome); if(t) return {v:p/t.q,base:t.base};
  if(/(^| )(KG|KILO|GRANEL)( |$)/.test(norm(it.nome))) return {v:null,base:'kg'}; // pesado na balança sem o peso na nota
  return {v:p,base:'un'};
}
function uRef(base,un){return base==='kg'?'/kg':base==='L'?'/L':'/'+String(un||'un').toLowerCase();}
function $$ref(c){return c&&c.ref!=null?$$(c.ref)+'<span class="un">'+uRef(c.base,c.un)+'</span>':$$(c?c.vUnit:0);}
/* Compara uma compra com a compra anterior do mesmo produto em um mês anterior.
   Prefere o mesmo mercado; se não houver, usa a mais recente de outro mercado. */
function anterior(G,i){
  var c=G.compras[i]; if(!c||c.ref==null) return null;
  var outro=null;
  for(var j=i-1;j>=0;j--){
    var p=G.compras[j]; if(p.mes>=c.mes||p.ref==null||p.base!==c.base||!comparavel(c.ref,p.ref,c.base)) continue;
    if(p.mid===c.mid) return {prev:p,v:c.ref/p.ref-1,mesmo:true};
    if(!outro) outro=p;
  }
  return outro?{prev:outro,v:c.ref/outro.ref-1,mesmo:false}:null;
}
function comparavel(a,b,base){var r=a/b,lim=base==='un'?2:3;return r<=lim&&r>=1/lim;}
function tom(v){return v==null?'':Math.abs(v)<0.005?'neu':v>0?'bad':'good';}

var C=null;

/* Nomes que o mesmo mercado usa com mais de um código (ex.: arroz 1 kg e 5 kg com o mesmo nome na nota) */
function variantes(){
  if(VC) return VC; var m={};
  S.notas.forEach(function(n){var mid=mercadoId(n);n.itens.forEach(function(it){if(!it.codigo)return;var k=mid+'|'+norm(it.nome);(m[k]=m[k]||{})[it.codigo]=1;});});

  return VC;
}
function grupoDe(mid,it){
  var k=itemKey(mid,it), base='G:'+norm(it.nome);
  if(variantes()[mid+'|'+norm(it.nome)]) base+='#'+mid+'#'+it.codigo;
  var g=S.links[k]||base;
  var seen=0; while(S.links[g]&&seen++<20) g=S.links[g];
  return g;
}
function calc(){
  if(C) return C;
  var meses={}, mercados={}, grupos={}, idx={};
  var notas=S.notas.slice().sort(function(a,b){return (a.data||'').localeCompare(b.data||'');});
  notas.forEach(function(n){
    var mk=(n.data||'').slice(0,7)||hojeMes(); var mid=mercadoId(n);
    (meses[mk]=meses[mk]||{total:0,notas:[],porMercado:{}});
    meses[mk].total+=n.total; meses[mk].notas.push(n);
    meses[mk].porMercado[mid]=(meses[mk].porMercado[mid]||0)+n.total;
    var m=(mercados[mid]=mercados[mid]||{id:mid,nome:'',total:0,compras:0,ultima:''});
    m.nome=nomeMercado(mid,n.mercado); m.total+=n.total; m.compras++; m.ultima=n.data;
    n.itens.forEach(function(it,ii){
      if(!(it.vUnit>0)) return;
      var g=grupoDe(mid,it), r=precoRef(it,S.pesos[g]);
      var G=(grupos[g]=grupos[g]||{id:g,nome:it.nome,compras:[],keys:{}});
      G.keys[itemKey(mid,it)]=it.nome;
      G.compras.push({mid:mid,data:n.data,mes:mk,vUnit:it.vUnit,un:it.un,qtd:it.qtd,vTotal:it.vTotal,nome:it.nome,nota:n.id,ref:r.v,base:r.base});
      idx[n.id+'|'+ii]={g:g,i:G.compras.length-1};
    });
  });
  Object.keys(grupos).forEach(function(g){
    var G=grupos[g]; G.porMercado={};
    G.compras.forEach(function(c){(G.porMercado[c.mid]=G.porMercado[c.mid]||[]).push(c);});
    G.nome=G.compras[G.compras.length-1].nome;
    G.mercados=Object.keys(G.porMercado);
    G.ultimo={}; G.mercados.forEach(function(m){var a=G.porMercado[m];G.ultimo[m]=a[a.length-1];});
    // base mais comum (kg, L ou un) e último preço comparável em cada mercado
    var cnt={}; G.compras.forEach(function(c){if(c.ref!=null)cnt[c.base]=(cnt[c.base]||0)+1;});
    G.base=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];})[0]||null;
    G.ultRef={}; G.mercados.forEach(function(m){var a=G.porMercado[m];for(var i=a.length-1;i>=0;i--){if(a[i].ref!=null&&a[i].base===G.base){G.ultRef[m]=a[i];break;}}});
    var best=null; Object.keys(G.ultRef).forEach(function(m){if(!best||G.ultRef[m].ref<G.ultRef[best].ref)best=m;}); G.maisBarato=best;
  });
  C={meses:meses,mercados:mercados,grupos:grupos,idx:idx,ranking:ranking(grupos,mercados)};
  return C;
}
/* Índice de cesta: para cada produto vendido em 2+ mercados, compara o preço mais recente
   de cada mercado com a média entre eles. A média geométrica dessas razões é o índice do mercado. */
function ranking(grupos,mercados){
  var acc={};
  Object.keys(grupos).forEach(function(g){
    var G=grupos[g], ms=Object.keys(G.ultRef); if(ms.length<2) return;
    var ps=ms.map(function(m){return G.ultRef[m].ref;});
    if(!comparavel(Math.max.apply(null,ps),Math.min.apply(null,ps),G.base)) return;
    var media=ps.reduce(function(a,b){return a+b;},0)/ps.length; if(!(media>0)) return;
    ms.forEach(function(m){var a=(acc[m]=acc[m]||{log:0,n:0,mais:0,menos:0});var r=G.ultRef[m].ref/media;a.log+=Math.log(r);a.n++;if(r<0.995)a.menos++;else if(r>1.005)a.mais++;});
  });
  return Object.keys(acc).map(function(m){var a=acc[m];return {id:m,nome:mercados[m]?mercados[m].nome:nomeMercado(m),indice:Math.exp(a.log/a.n)-1,n:a.n,maisBarato:a.menos,maisCaro:a.mais};})
    .sort(function(a,b){return a.indice-b.indice;});
}
function comparaPar(a,b){
  var c=calc(), itens=[], log=0;
  Object.keys(c.grupos).forEach(function(g){var G=c.grupos[g];if(G.ultRef[a]&&G.ultRef[b]&&comparavel(G.ultRef[a].ref,G.ultRef[b].ref,G.base)){var pa=G.ultRef[a].ref,pb=G.ultRef[b].ref;itens.push({g:G,pa:pa,pb:pb,u:uRef(G.base,G.ultRef[a].un)});log+=Math.log(pa/pb);}});
  itens.sort(function(x,y){return Math.abs(y.pa-y.pb)-Math.abs(x.pa-x.pb);});
  return {itens:itens,dif:itens.length?Math.exp(log/itens.length)-1:0};
}
/* Variação de preço dos itens do mês em relação à compra anterior do mesmo produto no mesmo mercado */
function variacoesDoMes(mk){
  var c=calc(), out=[];
  Object.keys(c.grupos).forEach(function(g){
    var G=c.grupos[g], visto={};
    for(var i=G.compras.length-1;i>=0;i--){
      var x=G.compras[i]; if(x.mes!==mk||visto[x.mid]||x.ref==null) continue; visto[x.mid]=1;
      var a=anterior(G,i); if(!a||!a.mesmo) continue;
      out.push({g:G,m:x.mid,de:a.prev,para:x,v:Math.abs(a.v)<0.001?0:a.v,mesAnt:a.prev.mes});
    }
  });
  return out;
}
/* Produtos comprados em meses diferentes: última compra vs compra de um mês anterior */
function repetidos(){
  var c=calc(), out=[];
  Object.keys(c.grupos).forEach(function(g){
    var G=c.grupos[g];
    for(var i=G.compras.length-1;i>=0;i--){if(G.compras[i].ref==null) continue; var a=anterior(G,i); if(a) out.push({G:G,c:G.compras[i],a:a}); break;}
  });
  return out;
}
function sugestoes(){
  var c=calc(), gs=Object.keys(c.grupos).map(function(k){return c.grupos[k];});
  var tok=function(G){return norm(G.nome).split(' ').filter(function(w){return w.length>1;});};
  var tam=function(G){var m=norm(G.nome).replace(/(\d)\s+(G|KG|ML|L|UN|LT)\b/g,'$1$2').match(/\b\d+(?:\s?\d+)?(G|KG|ML|L|LT)\b/);return m?m[0]:'';};
  var out=[];
  for(var i=0;i<gs.length;i++)for(var j=i+1;j<gs.length;j++){
    var A=gs[i],B=gs[j];
    if(A.mercados.some(function(m){return B.porMercado[m];})) continue;
    var key=[A.id,B.id].sort().join('~'); if(S.ignorados[key]) continue;
    var ta=tam(A),tb=tam(B); if(ta!==tb) continue;
    var ua=A.ultRef[Object.keys(A.ultRef)[0]], ub=B.ultRef[Object.keys(B.ultRef)[0]];
    if(ua&&ub&&(ua.base!==ub.base||!comparavel(ua.ref,ub.ref,ua.base))) continue;
    var a=tok(A),b=tok(B),inter=a.filter(function(w){return b.indexOf(w)>=0||b.some(function(x){return x.length>=3&&w.length>=3&&(x.indexOf(w)===0||w.indexOf(x)===0);});}).length;
    var sim=inter/Math.max(a.length,b.length); if(sim>=0.5) out.push({A:A,B:B,sim:sim,key:key});
  }
  return out.sort(function(x,y){return y.sim-x.sim;}).slice(0,3);
}
function juntar(A,B){
  // aponta todos os itens do grupo B para o grupo A
  Object.keys(B.keys).forEach(function(k){S.links[k]=A.id;});
  Object.keys(A.keys).forEach(function(k){if(!S.links[k])S.links[k]=A.id;});
  save();
}

function grupoDaLista(l){
  var c=calc(); if(l.g&&c.grupos[l.g]) return c.grupos[l.g];
  if(!l.g) return null; var q=norm(l.nome);
  for(var k in c.grupos){if(norm(c.grupos[k].nome)===q) return c.grupos[k];}
  return null;
}
function qtdMedia(G){var a=G.compras.map(function(c){return +c.qtd||1;});return a.reduce(function(x,y){return x+y;},0)/a.length;}
/* Frequência de recompra: intervalo médio entre dias de compra e há quantos dias foi a última */
function ritmo(G){
  var dias=[];G.compras.forEach(function(c){var d=(c.data||'').slice(0,10);if(d&&dias.indexOf(d)<0)dias.push(d);});
  if(dias.length<2) return null; dias.sort();
  var t=dias.map(function(d){return new Date(d+'T12:00:00').getTime();});
  var media=(t[t.length-1]-t[0])/(t.length-1)/864e5, desde=(Date.now()-t[t.length-1])/864e5;
  if(!(media>0)) return null;
  return {media:media,desde:Math.max(0,Math.floor(desde)),razao:desde/media};
}
function sugestoesLista(){
  var c=calc(), na={}; S.lista.forEach(function(l){var G=grupoDaLista(l);if(G)na[G.id]=1;});
  return Object.keys(c.grupos).map(function(k){return c.grupos[k];}).filter(function(G){return !na[G.id];})
    .map(function(G){return {G:G,r:ritmo(G)};}).filter(function(x){return x.r;})
    .sort(function(a,b){return b.r.razao-a.r.razao;});
}
function ondeComprar(itens){
  var c=calc(), por={};
  Object.keys(c.mercados).forEach(function(m){por[m]={id:m,n:0,est:0,log:0,nc:0};});
  var melhorSoma=0, comPreco=0;
  itens.forEach(function(G){
    var q=qtdMedia(G), ms=Object.keys(G.ultRef), refs=ms.map(function(m){return G.ultRef[m].ref;});
    var media=refs.length?refs.reduce(function(a,b){return a+b;},0)/refs.length:0, menor=null;
    G.mercados.forEach(function(m){var e=q*G.ultimo[m].vUnit;por[m].n++;por[m].est+=e;if(menor==null||e<menor)menor=e;});
    if(menor!=null){melhorSoma+=menor;comPreco++;}
    if(ms.length>=2&&media>0&&comparavel(Math.max.apply(null,refs),Math.min.apply(null,refs),G.base)) ms.forEach(function(m){por[m].log+=Math.log(G.ultRef[m].ref/media);por[m].nc++;});
  });
  var lista=Object.keys(por).map(function(m){var x=por[m];x.indice=x.nc?Math.exp(x.log/x.nc)-1:null;return x;}).filter(function(x){return x.n;})
    .sort(function(a,b){return (b.n-a.n)||((a.indice==null?0:a.indice)-(b.indice==null?0:b.indice));});
  return {mercados:lista,melhorSoma:melhorSoma,comPreco:comPreco};
}

function sugAdd(q){
  q=norm(q); if(q.length<2) return '';

var ABREV={TORR:'torrado',TRAD:'tradicional',INTEG:'integral',BCO:'branco',CRIST:'cristal',REFRIG:'refrigerante',REFRI:'refrigerante',DET:'detergente',LIQ:'liquido',AMAC:'amaciante',DESOD:'desodorante',SHAMP:'shampoo',MOLH:'molho',MAC:'macarrao',ESPAG:'espaguete',CHOC:'chocolate',BISC:'biscoito',REQ:'requeijao',IOG:'iogurte',QJO:'queijo',MUSS:'mussarela',PRES:'presunto',FGO:'frango',PTO:'peito',T1:'tipo 1',TP1:'tipo 1',PARB:'parboilizado',TRADIC:'tradicional',ACUC:'acucar',FEIJ:'feijao',SACH:'sache',SUAV:'suave'};

function termoAuto(nome){

function toks(s){return norm(s).split(' ').filter(function(w){return w.length>=3&&!/^\d/.test(w)&&!STOP[w];}).map(function(w){return ABREV[w]?norm(ABREV[w]).split(' ')[0]:w;});}

function pontua(alvo,c){

  var bate=function(w){return b.some(function(x){return x===w||(w.length>=3&&x.indexOf(w)===0)||(x.length>=4&&w.indexOf(x)===0);});};
  if(!bate(a[0])) return 0; // o tipo do produto (arroz, café...) precisa bater
  var hit=a.filter(bate).length, sc=hit/a.length;

function refCand(c){

  if(kg.length) return {qtd:kg.reduce(function(a,b){return a+b;},0)/kg.length,base:G.base,un:qtdMedia(G)};

function escolhido(P,it,lojaId){

function telaMercados(){

  }else{
    var mx=Math.max.apply(null,r.map(function(x){return Math.abs(x.indice);}).concat([0.01]));

      var good=x.indice<0;

  var ms=Object.keys(c.mercados).map(function(k){return c.mercados[k];}).sort(function(a,b){return b.total-a.total;});

    if(!p.itens.length) h+='<div class="empty">Esses dois mercados ainda não têm produtos em comum.</div>';
    else{
      h+='<div class="ok mt" style="'+(p.dif>0?'background:var(--redBg);color:#ffc2c8;border-color:rgba(255,107,122,.3)':'')+'">'+
        (Math.abs(p.dif)<0.005?'Os dois empatam nos '+p.itens.length+' produtos em comum.':'<b>'+esc(nA)+'</b> sai <b>'+pct(Math.abs(p.dif)).replace('+','')+(p.dif>0?' mais caro':' mais barato')+'</b> que '+esc(nB)+' nos '+p.itens.length+' produtos em comum.')+'</div>'+
        '<table class="ptable mt"><tr><th>Produto</th><th class="r">'+esc(nA.split(' ')[0])+'</th><th class="r">'+esc(nB.split(' ')[0])+'</th></tr>'+
        p.itens.slice(0,40).map(function(x){var aw=x.pa<x.pb,bw=x.pb<x.pa,u=x.u!=='/un'?'<span class="un">'+x.u+'</span>':'';return '<tr><td>'+esc(nomeG(x.g))+'</td><td class="r" style="'+(aw?'color:var(--lime);font-weight:700':'')+'">'+$$(x.pa)+u+'</td><td class="r" style="'+(bw?'color:var(--lime);font-weight:700':'')+'">'+$$(x.pb)+u+'</td></tr>';}).join('')+'</table>';

  return h;
}

function verProduto(gid){
  var G=calc().grupos[gid]; if(!G) return;
  var val=function(c){return c.ref!=null&&c.base===G.base;};
  var ms=G.mercados.slice().sort(function(a,b){return (G.ultRef[a]?G.ultRef[a].ref:1e12)-(G.ultRef[b]?G.ultRef[b].ref:1e12);});
  var nomes={};Object.keys(G.keys).forEach(function(k){nomes[G.keys[k]]=1;});

  else if(!G.base) h+='<p class="sub" style="margin:-6px 0 10px">Pesado na balança sem o peso na nota: não dá para comparar o preço do quilo.</p>';
  var cat=catDe(G), naLista=S.lista.some(function(l){var x=grupoDaLista(l);return x&&x.id===G.id&&!l.feito;});
  h+='<div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px"><select id="catProd" data-g="'+esc(G.id)+'" aria-label="Categoria">'+CATS.map(function(k){return '<option '+(k===cat?'selected':'')+'>'+k+'</option>';}).join('')+'</select>'+
    (naLista?'<span class="badge b-pur" style="padding:0 14px;font-size:13px">Na lista ✓</span>':'<button class="btn pur" style="padding:10px 14px;font-size:13.5px" data-act="addGrupoSheet" data-g="'+esc(G.id)+'">+ Lista</button>')+'</div>';
  var pw=S.pesos[G.id], semPeso=G.base==='un'||!G.base;
  if(G.id.indexOf('#')>=0&&!pw) h+='<div class="banner" style="background:rgba(240,196,106,.12);border-color:rgba(240,196,106,.35);display:block">Este mercado usa o <b>mesmo nome</b> para embalagens diferentes (ex.: 1 kg e 5 kg). O app separou pelo código do produto. Informe o peso desta embalagem para comparar pelo quilo.</div>';
  if(pw||semPeso) h+='<button class="btn full mb" data-act="peso" data-g="'+esc(G.id)+'">'+(pw?'Embalagem: <b>'+fmtTam(pw)+'</b> · alterar':'Informar peso/volume da embalagem')+'</button>';
  h+=spark(G);
  h+='<table class="ptable mt"><tr><th>Mercado</th><th class="r">Último</th><th class="r">Menor</th><th class="r">Maior</th></tr>'+ms.map(function(m,i){
    var u=G.ultRef[m], a=G.porMercado[m].filter(val).map(function(c){return c.ref;}), suf=G.base&&G.base!=='un'?'<span class="un">'+uRef(G.base)+'</span>':'';
    return '<tr><td>'+(Object.keys(G.ultRef).length>1&&m===G.maisBarato?'<span class="badge b-good" style="margin-right:6px">melhor</span>':'')+esc(nomeMercado(m))+'<div class="sub">'+dataBR((u||G.ultimo[m]).data)+'</div></td><td class="r"><b>'+(u?$$(u.ref)+suf:$$(G.ultimo[m].vUnit))+'</b></td><td class="r">'+(a.length?$$(Math.min.apply(null,a)):'—')+'</td><td class="r">'+(a.length?$$(Math.max.apply(null,a)):'—')+'</td></tr>';
  }).join('')+'</table>';
  var hist=[];for(var i=G.compras.length-1;i>=0&&hist.length<30;i--)hist.push(i);
  h+='<h2 class="mt" style="font-size:16px;margin-top:20px">Histórico</h2><div class="list">'+hist.map(function(i){
    var c=G.compras[i], a=anterior(G,i), t=a?tom(a.v):'', pac=c.ref!=null&&c.base!=='un'&&Math.abs(c.ref-c.vUnit)>0.005;
    return '<div class="li"><div class="tx"><div class="t1" style="font-weight:500">'+esc(nomeMercado(c.mid))+'</div><div class="t2">'+dataBR(c.data)+'/'+(c.data||'').slice(2,4)+' · '+String(c.qtd).replace('.',',')+' '+esc((c.un||'').toLowerCase())+(pac?' · pacote '+$$(c.vUnit):'')+'</div></div>'+
      '<div class="vv"><div class="pr '+t+'">'+$$ref(c)+'</div>'+(a&&t!=='neu'?'<span class="badge '+(t==='bad'?'b-bad':'b-good')+'">'+pct(a.v)+'</span>':'')+'</div></div>';
  }).join('')+'</div>';
  if(Object.keys(nomes).length>1) h+='<p class="sub mt">Nomes juntados: '+Object.keys(nomes).map(esc).join(' · ')+'</p><button class="btn full mt" data-act="separar" data-g="'+esc(G.id)+'">Separar estes nomes</button>';
  abrir(h);
}
function spark(G){
  var ok=function(p){return p.ref!=null&&p.base===G.base;};
  var pts=G.compras.filter(ok); if(pts.length<2) return '';
  var W=600,H=70,ys=pts.map(function(p){return p.ref;}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);if(mx===mn){mx+=1;mn-=1;}
  var t0=new Date(pts[0].data).getTime(),t1=new Date(pts[pts.length-1].data).getTime()||t0+1;if(t1===t0)t1=t0+1;
  var lines=G.mercados.map(function(m,i){var a=G.porMercado[m].filter(ok);if(!a.length)return '';var d=a.map(function(p,j){var x=(new Date(p.data).getTime()-t0)/(t1-t0)*(W-12)+6,y=H-6-(p.ref-mn)/(mx-mn)*(H-12);return (j?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join(' ');
    var cor=CORES[i%CORES.length];return '<path d="'+d+'" fill="none" stroke="'+cor+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+a.map(function(p){var x=(new Date(p.data).getTime()-t0)/(t1-t0)*(W-12)+6,y=H-6-(p.ref-mn)/(mx-mn)*(H-12);return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.5" fill="'+cor+'"/>';}).join('');}).join('');
  var leg=G.mercados.length>1?'<div class="chips mt">'+G.mercados.map(function(m,i){return '<span class="sub" style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:'+CORES[i%CORES.length]+'"></span>'+esc(nomeMercado(m))+'</span>';}).join('')+'</div>':'';
  return '<div class="card" style="padding:12px 12px 10px"><svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+lines+'</svg>'+leg+'</div>';
}

var cam={stream:null,raf:0,det:null,canvas:null,busy:false};
function telaScan(){
  abrir(shead('Ler nota fiscal')+
   '<div id="scanArea"><div class="cam"><video id="vid" playsinline muted></video><div class="frame"></div><div class="msg" id="camMsg">Abrindo a câmera…</div></div>'+
   '<p class="sub" style="text-align:center;margin:10px 0 4px">Aponte para o QR Code no fim da nota</p>'+
   '<div class="hr">ou</div><div class="stack"><input id="linkNota" placeholder="Cole aqui o link da nota" inputmode="url" autocomplete="off"><button class="btn pur full" data-act="buscarLink">Buscar nota pelo link</button>'+
   '<button class="btn full" data-act="modoTexto">A busca falhou? Colar o texto da página</button></div></div><div id="scanRes"></div>');
  iniciarCamera();
}
function iniciarCamera(){
  var msg=document.getElementById('camMsg');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent='Câmera indisponível aqui. Use o link abaixo.';return;}
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:1280}},audio:false}).then(function(st){
    cam.stream=st; var v=document.getElementById('vid'); if(!v){pararCamera();return;}
    v.srcObject=st; v.play(); msg.textContent='Procurando QR Code…';
    if('BarcodeDetector' in window){try{cam.det=new BarcodeDetector({formats:['qr_code']});}catch(e){cam.det=null;}}
    if(!cam.det&&!window.jsQR){var s=document.createElement('script');s.src='vendor/jsQR.js';document.head.appendChild(s);}
    loopScan();
  }).catch(function(){msg.textContent='Sem permissão para a câmera. Libere nas configurações ou use o link abaixo.';});
}
function loopScan(){
  var v=document.getElementById('vid'); if(!v||!cam.stream) return;
  cam.raf=requestAnimationFrame(loopScan);
  if(cam.busy||v.readyState<2) return;
  cam.busy=true;
  var done=function(txt){cam.busy=false;if(txt){achouQR(txt);}};
  if(cam.det){cam.det.detect(v).then(function(r){done(r&&r[0]&&r[0].rawValue);}).catch(function(){cam.det=null;done(null);});return;}
  if(window.jsQR){
    var c=cam.canvas||(cam.canvas=document.createElement('canvas')),s=Math.min(v.videoWidth,v.videoHeight),size=Math.min(720,s);
    c.width=c.height=size; var ctx=c.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,size,size);
    var r=window.jsQR(ctx.getImageData(0,0,size,size).data,size,size,{inversionAttempts:'dontInvert'});
    done(r&&r.data); return;
  }
  cam.busy=false;
}
function pararCamera(){cancelAnimationFrame(cam.raf);if(cam.stream){cam.stream.getTracks().forEach(function(t){t.stop();});}cam.stream=null;cam.busy=false;}
function achouQR(txt){
  pararCamera(); if(navigator.vibrate) navigator.vibrate(60);
  buscarNota(txt.trim());
}
function resArea(html){var r=document.getElementById('scanRes');if(r)r.innerHTML=html;}
function buscarNota(url){
  if(!/^https?:\/\//i.test(url)||!/\.gov\.br/i.test(url)){
    resArea('<div class="err mt">Esse QR Code não parece ser de nota fiscal ('+esc(url.slice(0,60))+'). Tente o QR Code do fim da nota.</div>'); if(document.getElementById('vid'))setTimeout(iniciarCamera,1500); return;
  }
  var chave=NotaParser.chaveFromUrl(url);
  if(chave&&S.notas.some(function(n){return n.chave===chave;})){resArea('<div class="ok mt">Essa nota já está salva.</div>');return;}
  document.getElementById('scanArea').classList.add('hide');
  resArea('<div class="card" style="display:flex;gap:12px;align-items:center"><span class="spin"></span><div><b>Buscando a nota na Fazenda…</b><div class="sub">Pode levar alguns segundos.</div></div></div>');
  fetch('api/nota?url='+encodeURIComponent(url)).then(function(r){
    var ct=r.headers.get('content-type')||''; if(ct.indexOf('json')<0) throw new Error('semponte');
    return r.json();
  }).then(function(d){
    if(d.erro) throw new Error(d.erro);
    var n=NotaParser.parseNotaHTML(d.html);
    if(!n.itens.length) throw new Error('A página abriu, mas não encontrei os produtos nela.');
    if(!n.chave&&chave) n.chave=chave;
    previa(n,url);
  }).catch(function(e){
    var m=e.message==='semponte'||/Failed to fetch|NetworkError|Load failed/i.test(e.message)?'Não consegui buscar a nota automaticamente daqui.':e.message;
    falhaBusca(m,url);
  });
}

  resArea('<div class="err">'+esc(m)+'</div><div class="card mt"><b>Plano B, leva 20 segundos:</b><ol class="sub" style="padding-left:18px;margin:8px 0 12px;line-height:1.6"><li>Toque em <b>Abrir a nota</b> abaixo</li><li>Na página da nota, toque e segure no texto → <b>Selecionar tudo</b> → <b>Copiar</b></li><li>Volte aqui e cole no campo</li></ol>'+
   (url?'<a class="btn full" href="'+esc(url)+'" target="_blank" rel="noopener">Abrir a nota</a>':'')+

function salvarPendente(){
  if(!pend) return; pararCamera();
  if(!pend.data){var dm=document.getElementById('dataManual');pend.data=(dm&&dm.value?dm.value:new Date().toISOString().slice(0,10))+'T12:00:00';}
  pend.id=pend.chave||('n'+Date.now()); pend.lidaEm=new Date().toISOString();
  var nota=pend; S.notas.push(pend); var mk=pend.data.slice(0,7); pend=null;

  var mid=mercadoId(nota), gsNota={}; nota.itens.forEach(function(it){gsNota[grupoDe(mid,it)]=1;});
  var marcados=0; S.lista.forEach(function(l){if(!l.feito&&l.g&&gsNota[l.g]){l.feito=true;marcados++;}});
  save(); V.mes=mk; V.tab='inicio'; render();
  resumoNota(nota,mk,marcados);

function resumoNota(n,mk,marcados){

    if(t==='bad')sub.push({G:G,a:a,c:G.compras[ix.i]});else if(t==='good')bai.push({G:G,a:a,c:G.compras[ix.i]});else igual++;});
  if(!sub.length&&!bai.length){fechar();toast('Nota salva em '+mesNome(mk)+(marcados?' · '+marcados+' itens da lista marcados':''));return;}
  sub.sort(function(x,y){return y.a.v-x.a.v;}); bai.sort(function(x,y){return x.a.v-y.a.v;});
  var linha=function(x,t){return '<div class="li"><div class="tx"><div class="t1">'+esc(nomeG(x.G))+'</div><div class="t2">'+mesCurto(x.a.prev.mes)+': '+$$ref(x.a.prev)+(x.a.mesmo?'':' em '+esc(nomeMercado(x.a.prev.mid)))+'</div></div><div class="vv"><div class="pr '+t+'">'+$$ref(x.c)+'</div><span class="badge '+(t==='bad'?'b-bad':'b-good')+'">'+pct(x.a.v)+'</span></div></div>';};
  abrir(shead('Nota salva')+

    '<p class="sub" style="margin:0 0 6px">Comparado com a sua compra em um mês anterior, pelo preço do kg/litro quando dá.</p>'+
    (sub.length?'<h2 class="mt" style="font-size:16px">Subiram</h2><div class="list">'+sub.slice(0,6).map(function(x){return linha(x,'bad');}).join('')+'</div>':'')+
    (bai.length?'<h2 class="mt" style="font-size:16px">Baixaram</h2><div class="list">'+bai.slice(0,6).map(function(x){return linha(x,'good');}).join('')+'</div>':'')+

function backupBlob(){var nome='meu-mercado-backup-'+new Date().toISOString().slice(0,10)+'.json';return {nome:nome,blob:new Blob([JSON.stringify(S,null,1)],{type:'application/json'})};}
function marcarBackup(){S.ultimoBackup=new Date().toISOString();save();}
/* Envia o backup pelo menu de compartilhar do celular (Google Drive, iCloud Drive, WhatsApp, e-mail…); sem suporte, baixa o arquivo */
function fazerBackup(){
  var b=backupBlob(), f=null;
  try{f=new File([b.blob],b.nome,{type:'application/json'});}catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f],title:'Backup Meu Mercado'}).then(function(){marcarBackup();render();toast('Backup enviado');}).catch(function(e){if(e&&e.name!=='AbortError'){exportar();}});
  }else exportar();
}
function exportar(){
  var blob=backupBlob().blob; marcarBackup(); if(V.tab==='inicio') render();
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meu-mercado-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
}
document.getElementById('importFile').addEventListener('change',function(e){

    S.notas=S.notas.concat(novas);S.nomes=Object.assign({},d.nomes,S.nomes);S.links=Object.assign({},d.links,S.links);S.ignorados=Object.assign({},d.ignorados,S.ignorados);S.cats=Object.assign({},d.cats,S.cats);S.pesos=Object.assign({},d.pesos,S.pesos);if(!S.meta&&d.meta)S.meta=d.meta;if(!S.lista.length&&d.lista)S.lista=d.lista;
    save();fechar();render();toast(novas.length+' notas restauradas');}catch(x){toast('Arquivo de backup inválido.');}};

});

/* ---------- dados de exemplo ---------- */
function exemplo(){
  var mercs=[{n:'MERCADO EXEMPLO CENTRO LTDA',c:'11.111.111/0001-11',f:1.0},{n:'SUPER EXEMPLO BAIRRO LTDA',c:'22.222.222/0001-22',f:1.07},{n:'ATACAREJO EXEMPLO S/A',c:'33.333.333/0001-33',f:0.93}];
  var prods=[['ARROZ TIPO 1 5KG','UN',27.9],['FEIJAO CARIOCA 1KG','UN',8.49],['ACUCAR CRISTAL 5KG','UN',21.9],['CAFE TORRADO 500G','UN',19.9],['LEITE UHT INTEGRAL 1L','UN',5.29],['OLEO DE SOJA 900ML','UN',7.49],['MACARRAO ESPAGUETE 500G','UN',4.79],['BANANA CATURRA KG','KG',5.99],['TOMATE KG','KG',7.9],['CEBOLA KG','KG',4.49],['BATATA KG','KG',5.49],['PEITO DE FRANGO KG','KG',17.9],['CARNE MOIDA KG','KG',36.9],['OVOS BRANCOS 12UN','UN',11.9],['PAO DE FORMA 500G','UN',8.9],['MANTEIGA 200G','UN',12.9],['QUEIJO MUSSARELA KG','KG',44.9],['PAPEL HIGIENICO 12 ROLOS','UN',21.9],['DETERGENTE 500ML','UN',2.69],['SABAO EM PO 1KG','UN',15.9],['RACAO CAES 3KG','UN',39.9],['IOGURTE NATURAL 170G','UN',3.49]];
  var var2={'MERCADO EXEMPLO CENTRO LTDA':{'CAFE TORRADO 500G':'CAFE TORR.TRAD. 500G','LEITE UHT INTEGRAL 1L':'LEITE UHT INTEG 1L'}};
  var seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
  var hoje=new Date(), notas=[];
  for(var mo=4;mo>=0;mo--){
    var inf=1+(4-mo)*0.012;
    var visitas=mo===0?[[0,3],[2,6]]:[[0,4],[2,11],[1,19],[0,25]];
    visitas.forEach(function(v,vi){
      var d=new Date(hoje.getFullYear(),hoje.getMonth()-mo,v[1],10+vi*2,15,0); if(d>hoje) return;
      var M=mercs[v[0]], itens=[];
      prods.forEach(function(p,pi){
        if(rnd()>0.55) return;
        var preco=Math.round(p[2]*M.f*inf*(0.94+rnd()*0.12)*100)/100;
        var qtd=p[1]==='KG'?Math.round((0.4+rnd()*1.4)*1000)/1000:(rnd()>0.75?2:1);
        var nome=(var2[M.n]&&var2[M.n][p[0]])||p[0];
        itens.push({nome:nome,codigo:String(1000+pi+v[0]*100),qtd:qtd,un:p[1],vUnit:preco,vTotal:Math.round(preco*qtd*100)/100});
      });
      var tot=itens.reduce(function(a,i){return a+i.vTotal;},0);
      var iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':15:00';
      notas.push({id:'ex'+mo+'-'+vi,origem:'exemplo',mercado:M.n,cnpj:M.c,endereco:'Rua de Exemplo, 100, Centro',data:iso,itens:itens,total:Math.round(tot*100)/100,desconto:0,pagamento:['Cartão de Débito','Pix','Cartão de Crédito'][vi%3],chave:''});
    });
  }
  S.notas=S.notas.filter(function(n){return n.origem!=='exemplo';}).concat(notas); V.mes=null; save(); fechar(); render(); toast('Dados de exemplo carregados');
}
function limparExemplo(){S.notas=S.notas.filter(function(n){return n.origem!=='exemplo';});V.mes=null;save();fechar();render();toast('Dados de exemplo apagados');}

/* ---------- eventos ---------- */
var tt;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(function(){t.style.display='none';},2600);}
document.addEventListener('click',function(e){
  if(V.dicaEl&&!e.target.closest('#dicaBalao')) tirarDica();
  var t=e.target.closest('[data-tab],[data-act]'); if(!t) { if(e.target.id==='overlay') fechar(); return; }
  if(t.dataset.tab){V.tab=t.dataset.tab;fechar();render();window.scrollTo(0,0);return;}
  var a=t.dataset.act;
  switch(a){
    case 'scan': case 'scanOutra': telaScan(); break;
    case 'fechar': fechar(); break;
    case 'ajustes': telaAjustes(); break;
    case 'mes': V.mes=addMes(mesAtual(),+t.dataset.n); render(); break;
    case 'irmes': V.mes=t.dataset.mes; render(); break;
    case 'nota': verNota(t.dataset.id); break;
    case 'produto': verProduto(t.dataset.g); break;
    case 'exemplo': exemplo(); break;
    case 'limparExemplo': limparExemplo(); break;
    case 'exportar': exportar(); break;
    case 'compartilhar':
      var link=location.origin+'/', msg='Meu Mercado: leia o QR Code da nota fiscal e compare seus gastos de mercado. '+link;
      if(navigator.share){navigator.share({title:'Meu Mercado',text:'Leia o QR Code da nota fiscal e compare seus gastos de mercado.',url:link}).catch(function(){});}
      else if(navigator.clipboard){navigator.clipboard.writeText(msg).then(function(){toast('Link copiado!');},function(){prompt('Copie o link:',link);});}
      else prompt('Copie o link:',link);
      break;
    case 'importar': document.getElementById('importFile').click(); break;
    case 'apagarTudo': if(confirm('Apagar todas as notas e ajustes deste celular?')){S=vazio();V.mes=null;save();fechar();render();} break;
    case 'apagarNota': if(confirm('Apagar esta nota?')){S.notas=S.notas.filter(function(n){return n.id!==t.dataset.id;});save();fechar();render();toast('Nota apagada');} break;
    case 'buscarLink': var u=(document.getElementById('linkNota').value||'').trim(); if(u){pararCamera();buscarNota(u);} break;
    case 'modoTexto': pararCamera(); document.getElementById('scanArea').classList.add('hide'); falhaBusca('Cole o texto da página da nota.',(document.getElementById('linkNota').value||'').trim()); break;
    case 'lerTexto':
      var tx=document.getElementById('textoNota').value; var n=NotaParser.parseNotaText(tx);
      if(!n.itens.length){toast('Não encontrei produtos nesse texto.');break;}
      if(!n.chave&&t.dataset.url) n.chave=NotaParser.chaveFromUrl(t.dataset.url)||'';
      n.origem='texto'; previa(n,t.dataset.url); break;
    case 'salvarNota': salvarPendente(); break;
    case 'addGrupoSheet': addLista(calc().grupos[t.dataset.g]); t.outerHTML='<span class="badge b-pur" style="padding:0 14px;font-size:13px">Na lista ✓</span>'; render(); break;
    case 'addGrupo': addLista(calc().grupos[t.dataset.g]); if(V.tab==='lista') render(); else toast('Adicionado à lista'); break;
    case 'addLivre': var ia=document.getElementById('addLista'), tx2=(ia&&ia.value||'').trim(); if(tx2){var exato=null,cg=calc().grupos;for(var k in cg){if(norm(cg[k].nome)===norm(tx2)){exato=cg[k];break;}} addLista(exato,tx2); render(); var ni=document.getElementById('addLista'); if(ni) ni.focus();} break;
    case 'addHora': sugestoesLista().filter(function(x){return x.r.razao>=0.85;}).forEach(function(x){S.lista.push({id:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),g:x.G.id,nome:x.G.nome,feito:false});}); save(); render(); break;
    case 'toggleLista': S.lista.forEach(function(l){if(l.id===t.dataset.id)l.feito=!l.feito;}); save(); render(); break;
    case 'tirarLista': S.lista=S.lista.filter(function(l){return l.id!==t.dataset.id;}); save(); render(); break;
    case 'limparFeitos': S.lista=S.lista.filter(function(l){return !l.feito;}); save(); render(); break;
    case 'meta': var mv=prompt('Meta de gasto no mercado por mês (R$). Deixe vazio para remover:',S.meta?String(S.meta).replace('.',','):''); if(mv!==null){var nv=NotaParser.num(mv);S.meta=nv>0?Math.round(nv*100)/100:0;save();render();} break;
    case 'backupJa': fazerBackup(); break;
    case 'peso':
      var gp=t.dataset.g, atualP=S.pesos[gp]?fmtTam(S.pesos[gp]):'';
      var resp=prompt('Peso ou volume da embalagem (ex.: 5kg, 1kg, 500g, 2L, 900ml).\nDeixe vazio para remover:',atualP);
      if(resp===null) break;
      if(!resp.trim()){delete S.pesos[gp];save();fechar();render();verProduto(gp);toast('Peso removido');break;}
      var tp=tamanho(resp.replace(/\s+/g,''));
      if(!tp){toast('Não entendi. Escreva como 5kg, 500g ou 1L.');break;}
      S.pesos[gp]=tp; save(); render(); verProduto(gp); toast('Agora comparando por '+(tp.base==='L'?'litro':'quilo'));
      break;
    case 'pesquisarPrecos': pesquisarPrecos(); break;
    case 'importarCardapio': importarCardapio(); break;
    case 'impColar': if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(tx){var ta=document.getElementById('txtCardapio');if(ta)ta.value=tx;},function(){toast('Segure no campo e toque em Colar');});}else toast('Segure no campo e toque em Colar'); break;
    case 'impTexto': var its0=textoParaItens((document.getElementById('txtCardapio')||{}).value); if(!its0.length){toast('Não achei itens. Cole a lista do botão Copiar lista do Cardápio.');break;} telaImportar({itens:its0}); break;
    case 'impTg': V.imp.forEach(function(x){if(x.i===+t.dataset.i)x.on=!x.on;}); var top0=document.getElementById('sheet').scrollTop; desenharImport(); document.getElementById('sheet').scrollTop=top0; break;
    case 'impOk':
      var nAdd=0; (V.imp||[]).forEach(function(x){if(!x.on)return;var al=partesAlvo(x.parts);
        S.lista.push({id:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),g:x.G?x.G.id:null,nome:x.G?x.G.nome:x.n,feito:false,qtd:x.qtd,orig:'cardapio',alvoQ:al,termo:x.G?undefined:x.n});nAdd++;});
      V.imp=null; save(); V.tab='lista'; render();
      abrir(shead('Itens na lista')+'<div class="ok">'+nAdd+(nAdd===1?' item do cardápio foi adicionado':' itens do cardápio foram adicionados')+' à sua lista.</div>'+
        '<p class="sub" style="margin:12px 2px">Quer ver agora quanto essa lista custa hoje no Muffato, Angeloni e Atacadão perto de você?</p>'+
        '<div class="stack"><button class="btn pri full" data-act="pesquisarPrecos">'+I.search.replace('<svg','<svg style="width:18px;height:18px"')+' Comparar preços agora</button><button class="btn full" data-act="fechar">Depois</button></div>');
      break;
    case 'novidades': verNovidades(); break;
    case 'mostrarOnde': mostrarOnde(+t.dataset.i); break;
    case 'raio': S.raio=+t.dataset.v; save(); pesquisarPrecos(); break;
    case 'cands': verCands(t.dataset.i,t.dataset.l); break;
    case 'escolher': if(S.pesquisa){S.pesquisa.escolha[t.dataset.i+'|'+t.dataset.l]=+t.dataset.k;save();} fechar(); render(); break;
    case 'termo':
      var li=S.lista.filter(function(x){return x.id===t.dataset.id;})[0]; if(!li) break;
      var Gt=grupoDaLista(li), atualT=li.termo||termoAuto(Gt?Gt.nome:li.nome);
      var novoT=prompt('Como pesquisar este produto nos sites? (ex.: arroz tio joão 5kg)',atualT);
      if(novoT===null) break; novoT=novoT.trim();
      if(novoT&&novoT!==atualT){li.termo=novoT;save();pesquisarItem(li.id);} else if(!novoT){delete li.termo;save();pesquisarItem(li.id);}
      break;
    case 'pview': V.pview=t.dataset.v; render(); break;
    case 'rep': V.rep=t.dataset.v; render(); break;
    case 'juntar': var c=calc(); juntar(c.grupos[t.dataset.a],c.grupos[t.dataset.b]); render(); toast('Produtos juntados'); break;
    case 'ignorar': S.ignorados[t.dataset.k]=1; save(); render(); break;
    case 'separar': separar(calc().grupos[t.dataset.g]); fechar(); render(); toast('Nomes separados'); break;
    case 'renomear': var atual=nomeMercado(t.dataset.id); var novo=prompt('Nome do mercado:',atual); if(novo&&novo.trim()){S.nomes[t.dataset.id]=novo.trim();save();render();} break;
  }
});
